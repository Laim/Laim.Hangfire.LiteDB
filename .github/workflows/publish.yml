name: Publish to NuGet.org

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tags must be in the form v1.0.0 or v1.0.0-preview.1" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore Hangfire.LiteDB.sln
      - name: Build
        run: dotnet build Hangfire.LiteDB.sln -c Release --no-restore -p:Version=${{ env.PACKAGE_VERSION }}
      - name: Test
        run: dotnet test test/Hangfire.LiteDB.Test/Hangfire.LiteDB.Test.csproj -c Release --no-build -p:Version=${{ env.PACKAGE_VERSION }}
      - name: Pack
        run: dotnet pack src/Hangfire.LiteDB/Hangfire.LiteDB.csproj -c Release --no-build -p:Version=${{ env.PACKAGE_VERSION }} --output ./artifacts
      - name: Check NuGet.org username
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Set the NUGET_USER GitHub Actions repository variable to your NuGet.org username." >&2
            exit 1
          fi
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet.org
        env:
          NUGET_TEMP_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push "./artifacts/Laim.Hangfire.LiteDB.${PACKAGE_VERSION}.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_TEMP_API_KEY" --skip-duplicate
